name: kelime_bahis
description: Full offline Türkçe kelime oyunu (Adventure kule modu + Classic sonsuz mod).
publish_to: "none"
version: 1.1.2+10

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.6
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.2.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: assets/branding/app_icon_background.png
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#17130C"
  color_dark: "#17130C"
  image: assets/branding/app_icon_foreground.png
  android: true
  ios: false
  android_12:
    color: "#17130C"
    color_dark: "#17130C"
    image: assets/branding/app_icon_foreground.png
    icon_background_color: "#17130C"
    icon_background_color_dark: "#17130C"

flutter:
  uses-material-design: true
  assets:
    - assets/dictionary/tr_words.txt
    - assets/audio/sfx/
  fonts:
    - family: LibreCaslonText
      fonts:
        - asset: assets/fonts/LibreCaslonText-Regular.ttf
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
